const bar = document.querySelector('.bar'), intro = document.getElementById('intro');
const pv = document.getElementById('p'), pctx = pv.getContext('2d');
const N = cv.width, CX = N/2, CY = N/2, RMAX = Math.hypot(CX, CY);
let lum, inverted = false, raf;

function prepare(img){
  const o = document.createElement('canvas'); o.width = o.height = N;
  const oc = o.getContext('2d'); oc.drawImage(img, 0, 0, N, N);
  const d = oc.getImageData(0,0,N,N).data;
  lum = new Float32Array(N*N);
  const hist = new Uint32Array(256);
  for(let i=0;i<N*N;i++){
    const v = .299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
    lum[i]=v; hist[v|0]++;
  }
  // растяжка контраста по перцентилям
  let acc=0, lo=0, hi=255;
  for(let i=0;i<256;i++){acc+=hist[i]; if(acc>N*N*.03){lo=i;break}}
  acc=0;
  for(let i=255;i>=0;i--){acc+=hist[i]; if(acc>N*N*.03){hi=i;break}}
  for(let i=0;i<N*N;i++) lum[i]=Math.min(1,Math.max(0,(lum[i]-lo)/(hi-lo||1)));
}

function draw(){
  cancelAnimationFrame(raf);
  bar.classList.remove('show');
  ctx.fillStyle = '#050000'; ctx.fillRect(0,0,N,N);
  pctx.clearRect(0,0,N,N);
  const fs = GAP*1.15, font = `bold ${fs}px "Courier New", monospace`;
  ctx.font = font; pctx.font = font;
  ctx.textAlign = pctx.textAlign = 'center';
  ctx.textBaseline = pctx.textBaseline = 'middle';
  const cw = ctx.measureText('M').width;
  let theta = 0.5, idx = 0, done = false, tail = [];

  function glyph(c, x, y, rot, ch, fill){
    c.fillStyle = fill; c.save(); c.translate(x,y); c.rotate(rot); c.fillText(ch,0,0); c.restore();
  }

  function step(){
    const r0 = GAP*theta/(2*Math.PI);
    const n = Math.round(START + (MAXSPD-START)*Math.pow(Math.min(1,r0/RMAX),2));
    for(let k=0;k<n && !done;k++){
      const r = GAP*theta/(2*Math.PI);
      if(r > RMAX){ done = true; break; }
      const x = CX + r*Math.cos(theta), y = CY + r*Math.sin(theta);
      const ch = TEXT[idx++ % TEXT.length];
      const rot = theta + Math.PI/2;
      theta += cw / Math.max(r, 3);
      if(ch===' ') continue;
      if(x>=0 && y>=0 && x<N && y<N){
        let l = lum[(y|0)*N + (x|0)];
        if(inverted) l = 1-l;
        l = Math.max(.12, Math.pow(l, 1.25));
        glyph(ctx, x, y, rot, ch, `rgb(${RGB[0]*l|0},${RGB[1]*l|0},${RGB[2]*l|0})`);
      }
      tail.push([x,y,rot,ch]); if(tail.length>TAIL) tail.shift();
    }
    // яркое перо: свежие буквы светятся белым и гаснут
    pctx.clearRect(0,0,N,N);
    if(!done){
      tail.forEach((t,i)=>{
        const a = (i+1)/tail.length;
        glyph(pctx, t[0],t[1],t[2],t[3], `rgba(255,${150+100*a|0},${130+100*a|0},${a})`);
      });
      raf = requestAnimationFrame(step);
    } else {
      setTimeout(()=>bar.classList.add('show'), 600);
    }
  }
  step();
}

const img = new Image();
img.onload = () => { prepare(img); runIntro().then(draw); };
img.src = PHOTO;

let skipIntro = false;
let introActive = false;
document.addEventListener('click', () => { if(introActive) skipIntro = true; });
function wait(ms){
  return new Promise(res => {
    const t0 = performance.now();
    (function tick(){ (skipIntro || performance.now()-t0 >= ms) ? res() : setTimeout(tick, 50); })();
  });
}
async function runIntro(){
  skipIntro = false; introActive = true;
  cv.parentElement.style.opacity = 0;
  for(const line of INTRO){
    if(skipIntro) break;
    intro.textContent = line;
    intro.classList.add('on');
    await wait(LINE_MS - 1000);
    intro.classList.remove('on');
    await wait(1000);
  }
  intro.classList.remove('on'); introActive = false;
  cv.parentElement.style.opacity = 1;
}

async function saveImage(){
  const out = document.createElement('canvas'); out.width = out.height = N;
  const oc = out.getContext('2d');
  oc.fillStyle = '#050000'; oc.fillRect(0,0,N,N); oc.drawImage(cv,0,0);
  const blob = await new Promise(r => out.toBlob(r,'image/png'));
  const file = new File([blob],'i_love_you.png',{type:'image/png'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'I love you'});   // на телефоне: «Сохранить изображение»
      return;
    }
  }catch(e){ if(e.name==='AbortError') return; }
  const a = document.createElement('a');                            // запасной вариант: скачать файл
  a.href = URL.createObjectURL(blob); a.download = 'i_love_you.png';
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('save').onclick = saveImage;
document.getElementById('replay').onclick = draw;
document.getElementById('invert').onclick = () => { inverted = !inverted; draw(); };
</script>
